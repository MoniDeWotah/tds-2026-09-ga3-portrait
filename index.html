<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ngozi Okonjo-Iweala reconstructed portrait</title>
<style>body{margin:0;background:#e9e4dd;color:#25221f;font:16px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:24px;top:18px;max-width:350px;background:#ffffffdd;padding:16px 20px;border-radius:12px}h1{font-size:20px;margin:0 0 8px}p{margin:8px 0;line-height:1.5}button{background:#352f2a;color:white;border:0;padding:8px 14px;border-radius:6px;margin-right:6px;cursor:pointer}small{color:#635d56}#status{font-size:14px}</style>
<aside><h1>Ngozi Okonjo-Iweala</h1><p>Drag to rotate. Scroll to zoom.</p><p><button id="front">Front</button><button id="side">Three quarter</button></p><small>Face measured from the assigned IMF photograph. Hidden surfaces are estimated.</small><p id="status">Loading portrait…</p></aside>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xe9e4dd);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,20);camera.position.set(0,.03,1.8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,-.05,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x877c70,2.5));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(-2,3,4);scene.add(key);const fill=new THREE.DirectionalLight(0xffe9d5,1.5);fill.position.set(3,0,2);scene.add(fill);
new GLTFLoader().load('./ngozi-face.glb',g=>{scene.add(g.scene);window.portrait=g.scene;document.querySelector('#status').textContent='Portrait ready';window.portraitReady=true},undefined,e=>{document.querySelector('#status').textContent='Could not load portrait';console.error(e)});
document.querySelector('#front').onclick=()=>{camera.position.set(0,.03,1.8);controls.target.set(0,-.05,0)};document.querySelector('#side').onclick=()=>{camera.position.set(.95,.10,1.2);controls.target.set(0,0,0)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></html>
